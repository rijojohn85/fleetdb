# This rule is not used by the project fleetdb itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over postgres.rijojohn.xyz.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: fleetdb
    app.kubernetes.io/managed-by: kustomize
  name: postgrestenant-admin-role
rules:
- apiGroups:
  - postgres.rijojohn.xyz
  resources:
  - postgrestenants
  verbs:
  - '*'
- apiGroups:
  - postgres.rijojohn.xyz
  resources:
  - postgrestenants/status
  verbs:
  - get
